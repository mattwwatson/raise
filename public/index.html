<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raise</title>
    <link id="favicon" rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #e2e5ea;
        --text: #1c2024;
        --muted: #6b7280;
        --faint: #9aa1ab;
        --blocked: #d92d20;
        --blocked-bg: #fef3f2;
        --review: #7839ee;
        --review-bg: #f9f5ff;
        --decision: #9333ea;
        --decision-bg: #faf5ff;
        --parked: #b54708;
        --parked-bg: #fffaeb;
        --failed: #7a271a;
        --working: #175cd3;
        --idle: #667085;
        --done: #067647;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --panel: #161a20;
          --border: #262c36;
          --text: #e6e8eb;
          --muted: #9aa1ab;
          --faint: #6b7280;
          --blocked: #ff6b5e;
          --blocked-bg: #2a1614;
          --review: #b692f6;
          --review-bg: #1e1830;
          --decision: #d8b4fe;
          --decision-bg: #241a33;
          --parked: #fdb022;
          --parked-bg: #2a2114;
          --failed: #ff8a7a;
          --working: #6699ff;
          --idle: #8b94a3;
          --done: #4ade80;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .counts {
        display: flex;
        gap: 6px;
        margin-left: 2px;
      }
      .pill {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.alert {
        color: var(--blocked);
        border-color: color-mix(in srgb, var(--blocked) 35%, transparent);
        background: var(--blocked-bg);
      }
      /*
       * Its own colour rather than the red one. A pill that does not match the
       * cards it is counting makes the colour coding mean nothing.
       */
      .pill.review {
        color: var(--review);
        border-color: color-mix(in srgb, var(--review) 35%, transparent);
        background: var(--review-bg);
      }
      .pill.decision {
        color: var(--decision);
        border-color: color-mix(in srgb, var(--decision) 35%, transparent);
        background: var(--decision-bg);
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        color: var(--text);
      }
      .conn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--faint);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--done);
      }
      .dot.off {
        background: var(--blocked);
      }
      /* Not yet heard from, which is not the same as healthy. */
      .dot.wait {
        background: var(--faint);
      }
      .conn.off {
        color: var(--blocked);
      }
      /*
       * Unconfirmed state must not look like confirmed state - including the
       * header count, which is the loudest thing on the page and was the one
       * part still rendering at full strength while everything under it dimmed.
       */
      body.unconfirmed main,
      body.unconfirmed .counts {
        opacity: 0.5;
        filter: saturate(0.55);
        transition:
          opacity 0.2s ease,
          filter 0.2s ease;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
      }
      .notice {
        border: 1px solid color-mix(in srgb, var(--parked) 35%, transparent);
        background: var(--parked-bg);
        color: var(--parked);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .group-title {
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        margin: 22px 0 8px;
      }
      .group-title:first-child {
        margin-top: 0;
      }
      /*
       * The card is a container, not a control. It used to be one <button>
       * wrapping everything, which is the simplest thing that works right up
       * until the row needs a second control - a nested button is invalid HTML
       * and unreachable by keyboard. The click target is `.hit`; `Focus ↗` and
       * the expander are their own buttons beside it.
       */
      .card {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        transition: border-color 0.12s ease;
      }
      .row-wrap {
        margin-bottom: 8px;
      }
      /* An open card and its panel read as one object, not two stacked ones. */
      .row-wrap.open .card {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom-color: transparent;
      }
      button.hit,
      div.hit {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        text-align: left;
        background: none;
        border: 0;
        padding: 0;
        border-radius: 4px;
      }
      button.hit {
        cursor: pointer;
      }
      .card.focusable:hover {
        border-color: color-mix(in srgb, var(--text) 25%, var(--border));
      }
      button.hit:active {
        transform: translateY(1px);
      }
      button.hit:focus-visible,
      button.expand:focus-visible,
      button.focus-hint:focus-visible {
        outline: 2px solid var(--working);
        outline-offset: 2px;
      }
      /*
       * Click-to-focus was invisible: a hover border change and a title
       * attribute, on a card that looks exactly like the ones that do nothing.
       * Say it in the row itself, quietly at rest and plainly on hover.
       */
      button.focus-hint {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--faint);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 6px;
        cursor: pointer;
        transition:
          color 0.12s ease,
          border-color 0.12s ease,
          background-color 0.12s ease;
      }
      .card.focusable:hover .focus-hint,
      button.focus-hint:hover,
      button.hit:focus-visible ~ .meta .focus-hint {
        color: var(--working);
        border-color: color-mix(in srgb, var(--working) 45%, transparent);
        background: color-mix(in srgb, var(--working) 10%, transparent);
      }
      /*
       * "Not for me" - the one control on this page that quiets a signal, so it
       * is drawn to be found rather than to be pressed. It borrows the focus
       * hint's shape because it lives beside it and answers the same row, and it
       * stays at rest colour on hover: focusing takes you somewhere and this
       * takes something away, so it must never be the more inviting of the two.
       */
      button.dismiss {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--faint);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 6px;
        cursor: pointer;
        transition:
          color 0.12s ease,
          border-color 0.12s ease;
      }
      button.dismiss:hover {
        color: var(--muted);
        border-color: color-mix(in srgb, var(--text) 30%, var(--border));
      }
      button.dismiss:focus-visible {
        outline: 2px solid var(--working);
        outline-offset: 2px;
      }
      /*
       * Why this row is idle rather than red. Never a silent suppression: a
       * signal hidden without saying so is the same quiet staleness as a green
       * dot over frozen state, which is the failure this page is built against.
       * Outlined and muted, because it is an explanation and not an alarm.
       */
      .dismissed {
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 4px;
      }
      /*
       * How many firstmate rulings this row is holding up. Beside the state word
       * and shaped like the `dismissed` marker, because it is the same kind of
       * thing: a word the state cannot say on its own, and one sentence with it.
       * Coloured, unlike that one, because here the number is the news - four
       * rulings and one are different situations, and the card has room for the
       * digit but not for the four paragraphs behind it.
       */
      .decisions-open {
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        flex: none;
        color: var(--decision);
        border: 1px solid color-mix(in srgb, var(--decision) 35%, transparent);
        border-radius: 4px;
        padding: 0 4px;
      }
      /*
       * The rulings themselves, in the expanded panel - which is where the card
       * sends anything longer than a word. A card carries the session's line and
       * the pipeline's line and may not grow a third stacked block, and four
       * summaries written at whatever length a crewmate needed is exactly the
       * shape that block would take.
       *
       * `decision-item` rather than `decision`, and the name matters. Every
       * attention level is a class on the card, the bar, the state word and the
       * header pill - `.card.decision`, `.pill.decision` and so on - so a bare
       * `.decision` rule matches all four at the same specificity and, sitting
       * later in the sheet, silently wins on every property those rules do not
       * restate. It did: the pill lost its padding and the card lost half its
       * height. No other attention word is used bare here, and none may be.
       */
      .decision-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 0;
        font-size: 12px;
        min-width: 0;
      }
      .decision-item + .decision-item {
        border-top: 1px solid var(--border);
      }
      /*
       * A column rather than a label, so the summaries line up down the panel.
       * `blocked` and `needs-decision` are different lengths and are the two
       * verbs that open a decision, so without this every `blocked` item starts
       * its text somewhere else and four rulings read as four unrelated blocks.
       * A longer verb simply pushes its own row, which is where this started.
       */
      .decision-verb {
        flex: none;
        min-width: 96px;
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--decision);
      }
      .decision-body {
        flex: 1;
        min-width: 0;
      }
      /*
       * The slug the crewmate wrote, which is the only thing telling four
       * otherwise similar rulings apart - and the token a `resolved` line closes
       * one by, so it is what the captain answers.
       */
      .decision-key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .decision-summary {
        margin-top: 2px;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      /*
       * Separates the rulings from the transcript lines under them. They are two
       * different things - what is waiting, and what it was doing - and the
       * panel must not read as one list.
       */
      .panel-heading {
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--faint);
        padding: 2px 0;
      }
      .panel-heading + .panel-heading,
      .decision-item + .panel-heading {
        margin-top: 8px;
      }
      /*
       * The expander. Only rendered for a row with a session behind it, since a
       * pipeline run with no Claude session has no transcript to show.
       */
      button.expand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        font-size: 10px;
        line-height: 1;
        color: var(--faint);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        transition: transform 0.14s ease, color 0.12s ease;
      }
      /*
       * Drawn from two borders rather than set as a glyph. The ▾ character
       * renders at wildly different weights across the system fonts - on this
       * machine it came out as a one pixel dot - and a control whose whole
       * meaning is its shape cannot be left to font fallback.
       */
      button.expand::before {
        content: '';
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
      }
      button.expand:hover {
        color: var(--text);
      }
      button.expand.open {
        transform: rotate(180deg);
        color: var(--text);
      }
      .panel {
        border: 1px solid var(--border);
        border-top: 0;
        border-radius: 0 0 10px 10px;
        background: var(--panel);
        padding: 4px 14px 10px 31px;
        box-shadow: var(--shadow);
      }
      .event {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 3px 0;
        font-size: 12px;
        min-width: 0;
      }
      .event + .event {
        border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
      }
      .event-time {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: var(--faint);
        flex: none;
        width: 52px;
      }
      .event-who {
        font-size: 10.5px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        flex: none;
        width: 58px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .event-who.you {
        color: var(--working);
      }
      .event-who.agent {
        color: var(--muted);
      }
      .event-who.tool {
        color: var(--faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: none;
        letter-spacing: 0;
      }
      .event-text {
        flex: 1;
        min-width: 0;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .event.tool .event-text {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      .event-outcome {
        flex: none;
        font-size: 11px;
        color: var(--faint);
      }
      .event-outcome.error {
        color: var(--blocked);
      }
      .event-outcome.running {
        color: var(--working);
      }
      .panel-empty {
        font-size: 12px;
        color: var(--faint);
        padding: 6px 0;
      }
      .card.blocked {
        border-color: color-mix(in srgb, var(--blocked) 45%, transparent);
        background: var(--blocked-bg);
      }
      .card.review {
        border-color: color-mix(in srgb, var(--review) 45%, transparent);
        background: var(--review-bg);
      }
      /*
       * The same colour family as `review` and not the same colour: both are a
       * human gate, and they are two different facts. A reader who cannot tell
       * them apart at a glance has one word doing the work of two.
       */
      .card.decision {
        border-color: color-mix(in srgb, var(--decision) 45%, transparent);
        background: var(--decision-bg);
      }
      .card.parked {
        border-color: color-mix(in srgb, var(--parked) 40%, transparent);
      }
      .bar {
        width: 3px;
        align-self: stretch;
        border-radius: 2px;
        background: var(--idle);
        flex: none;
      }
      .bar.blocked {
        background: var(--blocked);
      }
      .bar.review {
        background: var(--review);
      }
      .bar.decision {
        background: var(--decision);
      }
      .bar.parked {
        background: var(--parked);
      }
      .bar.failed {
        background: var(--failed);
      }
      .bar.working {
        background: var(--working);
      }
      /*
       * Fainter than idle, because it is not a state at all. A session nothing
       * has reported has no state that can honestly be read, so the card is
       * drawn to be legible and to compete with nothing on the page above it.
       */
      .bar.untracked {
        background: color-mix(in srgb, var(--faint) 40%, transparent);
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .line1 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        /*
         * The repo cannot shrink and the name has a floor, so on a window narrow
         * enough the line is wider than the card. Clipping it keeps that inside
         * the body rather than letting it run under the Focus button.
         */
        overflow: hidden;
      }
      .repo {
        font-weight: 620;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      /*
       * What you called this session. Identity, so it sits with the repo and the
       * branch rather than over in `.meta` with the controls - and prose rather
       * than monospace, which is the whole reason it needs no separator to be
       * told apart from the branch beside it. It gives before the repo does:
       * `.repo` is nowrap with no `min-width`, so a long name ellipsises itself
       * rather than squeezing the thing you scan by.
       *
       * `.meta` was never an option for it, on layout as well as on meaning:
       * that side is `flex: none` with no ellipsis, so a long name put there
       * would take the width it wanted and squeeze line 1 instead of giving.
       *
       * It never replaces `.summary`, which stays on its own line beneath. The
       * two answer different questions - what you meant the session for, and
       * what it turned out to be doing - and on a long session they drift apart,
       * which is itself worth seeing.
       */
      .name {
        font-size: 12.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /*
         * Gives well before the branch does. Both shrink, and flexbox shares the
         * loss in proportion to width, so a narrow window clipped `main` to
         * "ma…" while a long name beside it kept eighteen characters - the
         * shorter, load-bearing one destroyed to spare the one with room to
         * lose. A branch is unreadable the moment it is cut; a name is still
         * itself with its tail gone.
         *
         * The floor is what stops that becoming the opposite mistake. Shrinking
         * six times faster crushed a long name to zero width, and an element at
         * zero shows nothing at all - not even an ellipsis to say something was
         * there. "Fixi…" is a poor label and an honest one; a card that quietly
         * drops what you named the session is neither.
         */
        flex-shrink: 6;
        min-width: 5ch;
      }
      .branch {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /*
         * The same floor the name has, which for a short branch means no
         * shrinking at all: flexbox shares a deficit in proportion to width, so
         * `main` gave up the four pixels that turned it into "ma…" while the
         * name beside it still had a hundred to spare.
         */
        min-width: 5ch;
      }
      .line2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 3px;
        font-size: 12.5px;
        color: var(--muted);
        min-width: 0;
      }
      /*
       * Never wrapped. It is two or three words and the shortest thing on the
       * line, so when the row gets tight it is the message and the activity
       * that should give - both of which ellipsis. Letting the state fold puts
       * "Waiting for / you" over two lines and buckles the whole card.
       */
      .state {
        font-weight: 600;
        white-space: nowrap;
        flex: none;
      }
      .state.blocked {
        color: var(--blocked);
      }
      .state.review {
        color: var(--review);
      }
      .state.decision {
        color: var(--decision);
      }
      .state.parked {
        color: var(--parked);
      }
      .state.failed {
        color: var(--failed);
      }
      .state.working {
        color: var(--working);
      }
      /*
       * The one word in this slot that is not a state, so it is the one that
       * does not wear the weight of one: "Not tracked" describes what we know
       * about the session rather than what the session is doing.
       */
      .state.untracked {
        font-weight: 500;
        color: var(--faint);
      }
      .msg {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      /*
       * What the session is about, in Claude's own words. Third line, and
       * quieter than the state above it: it is what you read once you have
       * found the row you want, not what you scan for.
       */
      .summary {
        margin-top: 2px;
        font-size: 12px;
        color: var(--faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      /*
       * The pipeline's own agent, folded into the row of the repo it is working
       * on. Indented and marked, because "Reviewing terrain.ts" on the repo's
       * card would otherwise read as something you did.
       */
      .agent {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 2px;
        font-size: 12px;
        color: var(--faint);
        min-width: 0;
      }
      .agent-tag {
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 4px;
        flex: none;
      }
      .agent-what {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      /* The tool running right now, set apart from the state it qualifies. */
      .activity {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .mode {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--parked);
        border: 1px solid color-mix(in srgb, var(--parked) 35%, transparent);
        border-radius: 4px;
        padding: 0 4px;
        flex: none;
      }
      a.review-link {
        color: var(--review);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      a.review-link:hover {
        text-decoration: underline;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        font-size: 12px;
        color: var(--faint);
      }
      /*
       * Plain text, no chip. It sat next to the Focus chip looking identical,
       * so the row offered two lookalike pills of which only one did anything.
       */
      .host {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      /*
       * Which agent is running the session. Outlined rather than coloured: it
       * is provenance, not attention, and nothing on this page may compete with
       * the states that mean somebody is waiting.
       */
      .agent-chip {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--faint);
      }
      a.pr {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        color: var(--working);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      a.pr:hover {
        text-decoration: underline;
      }
      /*
       * The state word, and only when `PullRequest.current` says it may be read
       * as the state now - the run still going *and* the reading recent, both
       * halves being required for the reasons recorded on that field in
       * `src/nm-state.js`. A frozen reading rendered as current status is
       * exactly the confident-but-wrong signal this page must never give, so
       * the link survives the run and the state word does not.
       */
      .pr-state {
        font-size: 10.5px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid currentColor;
      }
      .pr-state.merged {
        color: var(--done);
      }
      .pr-state.open {
        color: var(--working);
      }
      .pr-state.closed,
      .pr-state.declined {
        color: var(--muted);
      }
      .empty {
        text-align: center;
        color: var(--faint);
        padding: 64px 20px;
      }
      .empty h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 14px;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        max-width: 80vw;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.bad {
        color: var(--blocked);
        border-color: color-mix(in srgb, var(--blocked) 40%, transparent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Raise</h1>
      <div class="counts" id="counts"></div>
      <div class="spacer"></div>
      <button id="notify">Enable alerts</button>
      <!--
        Housekeeping, so it wears the ordinary header-button style and no colour
        of its own. `blocked` red says a person is needed; this says only that
        the tab is running superseded code, and the attention ordering in
        AGENTS.md is deliberate - a notice about the page must never compete
        with a card about the work. It sits here, beside the alerts button and
        left of the connection indicator, because that is where the page's other
        facts about itself already live: the liveness dot and the alerts state
        are both about this tab's relationship with the server rather than about
        any session, and so is this. The warning slot inside <main> is for
        `payload.warning`, which is about the data being degraded.

        Hidden until there is genuinely something to reload for, which keeps the
        affordance rule: a control that is offered must work.
      -->
      <button id="build" hidden>Page out of date - reload</button>
      <span class="conn" id="conn"
        ><span class="dot" id="dot"></span><span id="connText">connecting</span></span
      >
    </header>

    <main>
      <div id="notice"></div>
      <div id="rows"></div>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module">
      const TOKEN = '__RAISE_TOKEN__';
      // Substituted by `servePage` at the moment these bytes were sent, so it
      // identifies the code this tab is actually running - not the code the
      // server happened to be serving when the first frame arrived. Left as the
      // literal placeholder only when the file is opened directly rather than
      // served, in which case there is no stream to compare it against anyway.
      const BUILD = '__RAISE_BUILD__';

      // Imported with the token, so serving it needs no exception to the rule
      // that /health is the only unauthenticated route.
      const { createConnectionWatch, connectionLabel, createBuildWatch } = await import(
        '/connection.js?t=' + TOKEN
      );

      const rowsEl = document.getElementById('rows');
      const countsEl = document.getElementById('counts');
      const noticeEl = document.getElementById('notice');
      const connEl = document.getElementById('conn');
      const dotEl = document.getElementById('dot');
      const connTextEl = document.getElementById('connText');
      const toastEl = document.getElementById('toast');
      const notifyBtn = document.getElementById('notify');
      const buildBtn = document.getElementById('build');
      const faviconEl = document.getElementById('favicon');

      let lastBlocked = new Set();
      let latest = null;
      let connectionTone = 'wait';

      const GROUPS = [
        ['blocked', 'Waiting for you'],
        ['review', 'Waiting on your review'],
        ['decision', 'Waiting on your decision'],
        ['parked', 'Pipeline parked'],
        ['failed', 'Failed'],
        ['working', 'Working'],
        ['idle', 'Idle'],
      ];

      /*
       * Where the session lives. "desktop" is the Claude Desktop app, which has
       * no tab and no tty - naming it a tab would be the one label on this page
       * that tells you to go looking somewhere it is not. A kind with no entry
       * here renders nothing at all, deliberately: this used to fall back to
       * "tab", which turned every host we failed to recognise into a confident
       * claim about a terminal.
       */
      const HOST_LABELS = { tmux: 'tmux', tab: 'tab', app: 'desktop', unknown: 'no window' };

      /*
       * Which agent, named only when it is worth naming. Claude Code has no
       * entry on purpose: it is most of the rows, and a chip on every card
       * saying so is noise on a page whose whole job is to be scannable - the
       * same reason `mode` hides 'normal'. The other two are the exceptions
       * worth marking, because what a state can and cannot mean differs by
       * agent: pi has no permission prompt, so a pi row never turns red for
       * one, and a Codex row that does turn red carries no reason, because
       * Codex has no notification to supply one and never invents it.
       *
       * No fallback, exactly as with HOST_LABELS. An agent we do not recognise
       * gets no chip rather than a confident wrong name.
       */
      const AGENT_LABELS = { pi: 'pi', codex: 'codex' };

      /*
       * Which tool started this window, named on the same terms as the agent:
       * only when it is worth naming, and never inferred. A firstmate crewmate
       * is otherwise indistinguishable from work you started yourself, which on
       * a page about who needs you is the distinction worth one quiet chip.
       *
       * No fallback again. A tool we do not recognise gets no chip, and a
       * session nobody in particular started - most of them - says nothing.
       */
      const SPAWNER_LABELS = { firstmate: 'firstmate' };

      /*
       * The same agents, for the one place that has to name somebody rather
       * than stay silent: an expanded panel labels every line with who wrote
       * it. Claude Code appears here and not in AGENT_LABELS because a label
       * on a line is required and a chip on a card is not. An agent neither
       * map knows falls back to the neutral word rather than to a name.
       */
      const AGENT_NAMES = { claude: 'claude', pi: 'pi', codex: 'codex' };

      /*
       * What an untracked row says instead of a status, in the same words
       * `raise status` uses - the page and the CLI are one protocol, and a row
       * explained on one and bare on the other is the two disagreeing about the
       * same session.
       *
       * It names where the row came from, what is missing and what to do, and
       * deliberately does not repeat the state word beside it.
       */
      const UNTRACKED_REASON =
        'Found on disk, never reported - restart the session and Raise will follow it';

      /*
       * The favicon carries the one thing worth knowing from a background tab:
       * whether anything wants you. This page is meant to be left pinned, where
       * the tab strip shows an icon and little else, so a static logo would be
       * the one place the state is not.
       *
       * Drawn rather than fetched - an inline SVG data URI keeps the page
       * self-contained and needs no build step or binary in the repo.
       */
      const FAVICON_COLOURS = {
        blocked: '#d92d20',
        review: '#7839ee',
        decision: '#9333ea',
        parked: '#b54708',
        failed: '#7a271a',
        working: '#175cd3',
        idle: '#98a2b3',
      };

      /**
       * A filled dot in the most urgent colour on the page, or a hollow ring
       * when the page has gone stale - the same honesty the header dot owes
       * you. A solid icon over state we can no longer vouch for would be a
       * confident green light on a dead feed.
       */
      function faviconFor(attention, live) {
        const colour = FAVICON_COLOURS[attention] || FAVICON_COLOURS.idle;
        const shape = live
          ? '<circle cx="16" cy="16" r="13" fill="' + colour + '"/>'
          : '<circle cx="16" cy="16" r="11" fill="none" stroke="#98a2b3" stroke-width="4"/>';
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' + shape + '</svg>';
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
      }

      let faviconHref = '';
      function showFavicon() {
        const rows = (latest && latest.rows) || [];
        // ATTENTION_ORDER is most-urgent-first and the server sorts on it, so
        // the top row is by definition the most urgent thing on the page.
        const attention = rows.length ? rows[0].attention : 'idle';
        const href = faviconFor(attention, connectionTone !== 'bad');
        // Reassigning an unchanged href makes some browsers refetch and flicker.
        if (href === faviconHref) return;
        faviconHref = href;
        faviconEl.href = href;
      }

      function ago(ms) {
        if (ms == null) return '';
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 60) return s + 's';
        const m = Math.floor(s / 60);
        if (m < 60) return m + 'm';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
        // Past a day, hours stop being a unit anyone reads - "72h 43m" is three
        // days, and nobody works that out at a glance. Pull requests are the
        // only thing here that lives long enough to need this.
        const d = Math.floor(h / 24);
        return d + 'd' + (h % 24 ? ' ' + (h % 24) + 'h' : '');
      }

      function toast(text, bad) {
        toastEl.textContent = text;
        toastEl.className = 'toast show' + (bad ? ' bad' : '');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (toastEl.className = 'toast'), 3200);
      }

      async function focusRow(row) {
        if (!row.focusable || !row.sessionId) return;
        try {
          const res = await fetch('/focus?t=' + TOKEN, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-raise-token': TOKEN },
            body: JSON.stringify({ sessionId: row.sessionId }),
          });
          const data = await res.json();
          // Success is otherwise silent - the window arriving in front of you is
          // the feedback. A note means it arrived on something less than what
          // you clicked, and staying quiet about that is how a monitor teaches
          // you to distrust it.
          if (data.ok) {
            if (data.note) toast(data.note);
          } else {
            toast(data.hint ? data.reason + '  ->  ' + data.hint : data.reason, true);
          }
        } catch (err) {
          toast('Could not reach Raise: ' + err.message, true);
        }
      }

      /*
       * Say that this "Waiting for you" was not owed.
       *
       * The server re-checks that the block is still a dismissible idle nudge,
       * so a click on a row that has since turned into a real permission prompt
       * is refused rather than honoured - a tab can be several seconds behind
       * what the session is actually doing.
       */
      async function dismissRow(row) {
        if (!row.dismissible || !row.sessionId) return;
        try {
          const res = await fetch('/dismiss?t=' + TOKEN, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-raise-token': TOKEN },
            body: JSON.stringify({ sessionId: row.sessionId }),
          });
          const data = await res.json();
          // Silent on success: the row dropping out of "Waiting for you" and
          // saying "dismissed" is the feedback, and it arrives on the push this
          // request triggers.
          if (!data.ok) toast(data.reason, true);
        } catch (err) {
          toast('Could not reach Raise: ' + err.message, true);
        }
      }

      // The PR link comes from the no-mistakes database, which Raise only ever
      // reads. The page allows inline script, so a "javascript:" value in that
      // column would run in the origin holding the monitor token. Only ever
      // navigate to the web.
      function webUrl(value) {
        if (typeof value !== 'string' || !value) return null;
        try {
          const url = new URL(value, location.href);
          return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
        } catch (err) {
          return null;
        }
      }

      /*
       * The expando: the last few things a session did, pulled on demand.
       *
       * Two pieces of state, because render() rebuilds the whole list from
       * scratch on every push and every five-second tick. Without `expanded` an
       * open panel would slam shut under the user a second after they opened
       * it; without `recent` it would flicker empty on each rebuild while the
       * fetch caught up.
       */
      const expanded = new Set();
      const recent = new Map();

      /** How often an open panel goes back for more. Closed ones cost nothing. */
      const EXPANDO_REFRESH_MS = 3000;

      async function fetchRecent(sessionId) {
        try {
          const res = await fetch(
            '/recent?session=' + encodeURIComponent(sessionId) + '&t=' + TOKEN,
          );
          const data = await res.json();
          // A session that has ended is not an error worth shouting about; the
          // row is about to disappear from the list anyway.
          recent.set(sessionId, data.ok ? data.events || [] : []);
        } catch (err) {
          recent.set(sessionId, []);
        }
      }

      async function loadRecent(sessionId) {
        await fetchRecent(sessionId);
        if (latest) render(latest);
      }

      /** Session ids behind the rows that are currently open. */
      function expandedSessionIds() {
        const rows = (latest && latest.rows) || [];
        return rows.filter((r) => expanded.has(r.id) && r.sessionId).map((r) => r.sessionId);
      }

      function toggleExpanded(row) {
        if (expanded.has(row.id)) {
          expanded.delete(row.id);
        } else {
          expanded.add(row.id);
          // Only a session has a transcript to read. A card of rulings expands
          // to the rulings and to nothing else.
          if (row.sessionId) loadRecent(row.sessionId);
        }
        if (latest) render(latest);
      }

      function eventTime(at) {
        if (!at) return '';
        const d = new Date(at);
        return (
          String(d.getHours()).padStart(2, '0') +
          ':' +
          String(d.getMinutes()).padStart(2, '0') +
          ':' +
          String(d.getSeconds()).padStart(2, '0')
        );
      }

      const OUTCOME_MARKS = { ok: '✓', error: '✗', running: '…' };

      function panelFor(row) {
        const panel = document.createElement('div');
        panel.className = 'panel';

        // The rulings first, because they are why you opened this row. Every one
        // of them, never a bounded subset - four open on one crewmate is the
        // ordinary case, and a panel that showed a quarter of what was waiting
        // would be this feature's own failure reintroduced by its fix. Should a
        // bound ever be needed here, it says how many it did not show.
        const decisions = row.decisions || [];
        if (decisions.length > 0) {
          const heading = document.createElement('div');
          heading.className = 'panel-heading';
          heading.textContent =
            decisions.length === 1
              ? 'Waiting on your decision'
              : decisions.length + ' decisions waiting on you';
          panel.appendChild(heading);
          for (const decision of decisions) {
            const item = document.createElement('div');
            item.className = 'decision-item';

            const verb = document.createElement('span');
            verb.className = 'decision-verb';
            verb.textContent = decision.verb;
            item.appendChild(verb);

            const bodyEl = document.createElement('div');
            bodyEl.className = 'decision-body';
            const key = document.createElement('div');
            key.className = 'decision-key';
            key.textContent = decision.key;
            bodyEl.appendChild(key);
            // In full, at whatever length the crewmate wrote it. This is a panel
            // somebody deliberately opened in order to rule on what is in it,
            // and the density rule that keeps the card to one line is exactly
            // why the words belong here instead.
            if (decision.summary) {
              const summary = document.createElement('div');
              summary.className = 'decision-summary';
              summary.textContent = decision.summary;
              bodyEl.appendChild(summary);
            }
            item.appendChild(bodyEl);
            panel.appendChild(item);
          }
          // Only where there is activity to head. A card of rulings has no
          // session behind it, so the heading would introduce a section that
          // never arrives.
          if (row.sessionId) {
            const activity = document.createElement('div');
            activity.className = 'panel-heading';
            activity.textContent = 'Recent activity';
            panel.appendChild(activity);
          }
        }
        if (!row.sessionId) return panel;

        const events = recent.get(row.sessionId);
        if (!events) {
          const loading = document.createElement('div');
          loading.className = 'panel-empty';
          loading.textContent = 'Reading the transcript…';
          panel.appendChild(loading);
          return panel;
        }
        if (events.length === 0) {
          const none = document.createElement('div');
          none.className = 'panel-empty';
          none.textContent = 'Nothing recorded yet.';
          panel.appendChild(none);
          return panel;
        }
        for (const event of events) {
          const line = document.createElement('div');
          line.className = 'event ' + event.kind;

          const time = document.createElement('span');
          time.className = 'event-time';
          time.textContent = eventTime(event.at);
          line.appendChild(time);

          const who = document.createElement('span');
          who.className = 'event-who ' + event.kind;
          // An `agent` line is named after the agent that actually wrote it.
          // The record cannot say - it is parsed from a file, and every agent
          // writes the same shape - so the row is what knows.
          who.textContent =
            event.kind === 'tool'
              ? event.label || 'tool'
              : event.kind === 'agent'
                ? AGENT_NAMES[row.agentKind] || 'agent'
                : event.kind;
          if (event.kind === 'tool' && event.label) who.title = event.label;
          line.appendChild(who);

          const text = document.createElement('span');
          text.className = 'event-text';
          text.textContent = event.text;
          line.appendChild(text);

          if (event.kind === 'tool' && event.outcome) {
            const mark = document.createElement('span');
            mark.className = 'event-outcome ' + event.outcome;
            mark.textContent = OUTCOME_MARKS[event.outcome] || '';
            line.appendChild(mark);
          }
          panel.appendChild(line);
        }
        return panel;
      }

      function card(row) {
        const wrap = document.createElement('div');
        wrap.className = 'row-wrap' + (expanded.has(row.id) ? ' open' : '');

        const el = document.createElement('div');
        el.className = 'card ' + row.attention + (row.focusable ? ' focusable' : '');
        wrap.appendChild(el);

        const bar = document.createElement('div');
        bar.className = 'bar ' + row.attention;
        el.appendChild(bar);

        const hit = document.createElement(row.focusable ? 'button' : 'div');
        hit.className = 'hit';
        if (row.focusable) {
          hit.addEventListener('click', () => focusRow(row));
          hit.title = 'Bring this window to the front';
          hit.setAttribute(
            'aria-label',
            row.title +
              // Read out for the same reason it is shown: with several sessions
              // on one repo, it is the only thing that tells them apart.
              (row.sessionName ? ', ' + row.sessionName : '') +
              ' - ' +
              row.attentionLabel +
              '. Bring this window to the front.',
          );
        }

        const body = document.createElement('div');
        body.className = 'body';

        const line1 = document.createElement('div');
        line1.className = 'line1';
        const repo = document.createElement('span');
        repo.className = 'repo';
        repo.textContent = row.title;
        line1.appendChild(repo);
        if (row.sessionName) {
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = row.sessionName;
          line1.appendChild(name);
        }
        if (row.branch) {
          const branch = document.createElement('span');
          branch.className = 'branch';
          branch.textContent = row.branch;
          line1.appendChild(branch);
        }
        body.appendChild(line1);

        const line2 = document.createElement('div');
        line2.className = 'line2';
        const state = document.createElement('span');
        state.className = 'state ' + row.attention;
        state.textContent = row.attentionLabel;
        line2.appendChild(state);

        // How many firstmate rulings are waiting, beside the state word. The
        // words are computed once in `dashboard.js` and rendered here and by
        // `raise status` alike - the two are one protocol, and the marker
        // disagreeing between them was a page that hid a ruling the CLI printed.
        const rulings = row.decisionsLabel;
        if (rulings) {
          const count = document.createElement('span');
          count.className = 'decisions-open';
          count.textContent = rulings;
          count.title = row.decisionsPending
            ? 'Open decisions across the whole crew. Rulings are given in this window.'
            : 'Open decisions on this crewmate. Expand the row to read them.';
          line2.appendChild(count);
        }

        // Why this row says Idle rather than Waiting for you. It sits directly
        // beside the state it qualifies, because the two are one sentence: the
        // page must never let "nothing is waiting" and "I told it to stop saying
        // so" look the same.
        if (row.dismissed) {
          const dismissed = document.createElement('span');
          dismissed.className = 'dismissed';
          dismissed.textContent = 'dismissed';
          dismissed.title =
            'You said this "Waiting for you" was not owed. The next time anything ' +
            'here asks for you - a permission prompt above all - this row goes red again.';
          line2.appendChild(dismissed);
        }

        // Why this card says nothing about what the session is doing, and the
        // one thing that fixes it. It sits beside the state rather than under
        // it, for the same reason the `dismissed` marker does: the two are one
        // sentence, and split over two lines they made the cards that say the
        // least the tallest ones on the page.
        //
        // The remedy is the same whatever the cause - hooks installed after the
        // session started, an agent whose hooks are not installed at all, or
        // Codex's hook still waiting to be trusted - so the words name the
        // remedy rather than guessing at which.
        if (row.kind === 'untracked') {
          const why = document.createElement('span');
          why.className = 'msg';
          why.textContent = UNTRACKED_REASON;
          line2.appendChild(why);
        }
        // Why *this session* wants you. The pipeline step used to share this
        // line, which put no-mistakes' business in the middle of the session's
        // own status - they are two different things happening at once, so the
        // step has a line of its own further down.
        if (row.message) {
          const msg = document.createElement('span');
          msg.className = 'msg';
          msg.textContent = row.message;
          line2.appendChild(msg);
        }
        // What it is doing this second, which only means anything while it is
        // still doing it. An idle row's last tool is history, not status.
        if (row.activity && row.attention !== 'idle') {
          const activity = document.createElement('span');
          activity.className = 'activity';
          activity.textContent = row.activity;
          line2.appendChild(activity);
        }
        if (row.mode) {
          const mode = document.createElement('span');
          mode.className = 'mode';
          mode.textContent = row.mode;
          line2.appendChild(mode);
        }
        body.appendChild(line2);

        // What the session itself is about, always. This used to be dropped
        // whenever a pipeline step existed, on the reasoning that the step said
        // it better - so the moment no-mistakes started, what you had been
        // talking to the session about disappeared off its card. The two are
        // concurrent, not alternatives.
        if (row.summary) {
          const summary = document.createElement('div');
          summary.className = 'summary';
          summary.textContent = row.summary;
          body.appendChild(summary);
        }
        // Why an unattributable run is on the page at all. It is the one card
        // here that is not a session, so it has to account for itself rather
        // than look like a session you failed to notice.
        if (row.attributable === false) {
          const why = document.createElement('div');
          why.className = 'summary';
          why.textContent =
            'Not traceable to a session' +
            (row.candidateSessions
              ? ' - probably one of your ' + row.candidateSessions + ' on this repo'
              : '');
          body.appendChild(why);
        }
        // What no-mistakes is doing, on the row of the session it is doing it
        // for rather than as a second card nobody can act on.
        //
        // Presence follows the *run* existing, never the activity: the tool in
        // flight goes null between every pair of calls, and a marker rendered on
        // it blinked in and out several times a minute, reading as the pipeline
        // stopping and starting. So the line stays and only its tail changes -
        // and the tail may be empty, which is a step that has not said anything
        // yet rather than a pipeline that has gone away.
        if (row.pipeline) {
          const pipeline = document.createElement('div');
          pipeline.className = 'agent';
          const tag = document.createElement('span');
          tag.className = 'agent-tag';
          tag.textContent = 'no-mistakes';
          pipeline.appendChild(tag);
          const text = document.createElement('span');
          text.className = 'agent-what';
          const findings = row.run && row.run.step ? row.run.step.findings : 0;
          text.textContent =
            row.pipeline.step +
            (findings ? ' - ' + findings + ' finding(s)' : '') +
            (row.pipeline.what ? ' · ' + row.pipeline.what : '');
          pipeline.appendChild(text);
          body.appendChild(pipeline);
        }
        hit.appendChild(body);
        el.appendChild(hit);

        const meta = document.createElement('div');
        meta.className = 'meta';
        // The whole point of the review state: the page it is waiting on is one
        // you opened a while ago and have since lost. Give it back.
        if (row.reviewUrl) {
          const a = document.createElement('a');
          a.className = 'review-link';
          a.href = row.reviewUrl;
          a.target = '_blank';
          a.rel = 'noreferrer';
          a.textContent = 'Review ↗';
          a.addEventListener('click', (e) => e.stopPropagation());
          meta.appendChild(a);
        }
        if (row.pr && webUrl(row.pr.url)) {
          const a = document.createElement('a');
          a.className = 'pr';
          a.href = webUrl(row.pr.url);
          a.target = '_blank';
          a.rel = 'noreferrer';
          const label = document.createElement('span');
          label.textContent = row.pr.number ? 'PR #' + row.pr.number : 'PR';
          a.appendChild(label);
          if (row.pr.current && row.pr.state && row.pr.state !== 'none') {
            const state = document.createElement('span');
            state.className = 'pr-state ' + row.pr.state;
            state.textContent = row.pr.state;
            a.appendChild(state);
          } else if (row.pr.state && row.pr.state !== 'none') {
            // Say it was true once, and when, rather than showing it as now.
            a.title =
              'Was ' +
              row.pr.state +
              (row.pr.observedAt ? ' when last checked ' + ago(Date.now() - row.pr.observedAt) + ' ago' : '');
          }
          a.addEventListener('click', (e) => e.stopPropagation());
          meta.appendChild(a);
        }
        // The absolute mark, never the server's elapsed value, so the ticking
        // re-render below stays accurate between pushes. Which mark - and which
        // rows have one at all - is decided once in `dashboard.js`; this page
        // held its own copy of that condition until the two had been edited in
        // step twice, so it now only asks whether there is one. See
        // `waitingSinceFor` for why a ruling row is gated on the session's own
        // state rather than on its attention word.
        const since = row.waitingSince;
        // How long it has been waiting is the number that decides what to deal
        // with first, so it keeps the slot on the rows that have one. Every
        // other row shows when it last actually did something instead - which
        // on a "Working" row is the difference between working and wedged.
        const stamp = since || row.lastActivityAt;
        if (stamp) {
          const t = document.createElement('span');
          t.textContent = ago(Date.now() - stamp);
          t.title =
            (since ? 'Waiting since ' : 'Last activity ') + new Date(stamp).toLocaleString();
          meta.appendChild(t);
        }
        // Provenance, so it sits with the agent chip and wears the same
        // outlined, faint style - it must not compete with where your window
        // actually is, let alone with the states that mean somebody is waiting.
        // Before the agent chip because it answers the earlier question: who
        // started this, then what is running in it.
        if (SPAWNER_LABELS[row.spawnedBy]) {
          const spawner = document.createElement('span');
          spawner.className = 'agent-chip';
          spawner.textContent = SPAWNER_LABELS[row.spawnedBy];
          // The chip covers the captain as well as the crew, and the captain is
          // the session you started firstmate from - so the tooltip asserts only
          // what the two markers prove, and never who started the window.
          spawner.title = SPAWNER_LABELS[row.spawnedBy] + ' session';
          meta.appendChild(spawner);
        }
        if (AGENT_LABELS[row.agentKind]) {
          const agent = document.createElement('span');
          agent.className = 'agent-chip';
          agent.textContent = AGENT_LABELS[row.agentKind];
          meta.appendChild(agent);
        }
        if (HOST_LABELS[row.hostKind]) {
          const host = document.createElement('span');
          host.className = 'host';
          host.textContent = HOST_LABELS[row.hostKind];
          meta.appendChild(host);
        }
        // Stands where the host chip would be, because it answers the same
        // question - where is this? - with the honest answer that we do not
        // know. `HOST_LABELS` has no entry for a run, so the two never collide.
        if (row.attributable === false) {
          const chip = document.createElement('span');
          chip.className = 'agent-chip';
          chip.textContent = 'unattributed';
          meta.appendChild(chip);
        }
        // Offered only on Claude Code's sixty-second nudge, and never on a
        // permission prompt: that session genuinely cannot proceed without you,
        // so there is nothing here to dismiss. Following the affordance rule,
        // such a row gets no control at all rather than a disabled one.
        if (row.dismissible) {
          const dismiss = document.createElement('button');
          dismiss.className = 'dismiss';
          dismiss.textContent = 'Not for me';
          dismiss.title =
            'Nothing is actually waiting on you here. The row drops to Idle and says it ' +
            'was dismissed, until this session asks for you again.';
          dismiss.setAttribute('aria-label', 'Dismiss the idle nudge on ' + row.title);
          dismiss.addEventListener('click', (e) => {
            e.stopPropagation();
            dismissRow(row);
          });
          meta.appendChild(dismiss);
        }
        if (row.focusable) {
          const hint = document.createElement('button');
          hint.className = 'focus-hint';
          hint.textContent = 'Focus ↗';
          hint.addEventListener('click', (e) => {
            e.stopPropagation();
            focusRow(row);
          });
          meta.appendChild(hint);
        }
        // A run with no session behind it has no transcript to expand - but a
        // card holding rulings does have something, and it is the only place the
        // words of them appear. Gating this on the session alone would have put
        // every ruling on the unplaceable card behind a control that was not
        // rendered, which is the set silently bounded by a missing button.
        if (row.sessionId || (row.decisions || []).length > 0) {
          const toggle = document.createElement('button');
          const open = expanded.has(row.id);
          // Named for what is actually behind it. On a row holding rulings the
          // panel leads with them, and a control offering "recent activity" over
          // the thing you are being asked to decide hides the one reason to open
          // it.
          const holds = (row.decisions || []).length > 0 ? 'the decisions' : 'recent activity';
          toggle.className = 'expand' + (open ? ' open' : '');
          toggle.title = (open ? 'Hide ' : 'Show ') + holds;
          toggle.setAttribute('aria-expanded', String(open));
          const label = holds === 'the decisions' ? 'Decisions waiting on ' : 'Recent activity for ';
          toggle.setAttribute('aria-label', label + row.title);
          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleExpanded(row);
          });
          meta.appendChild(toggle);
        }
        el.appendChild(meta);

        if (expanded.has(row.id)) wrap.appendChild(panelFor(row));
        return wrap;
      }

      function render(payload) {
        latest = payload;
        const rows = payload.rows || [];

        // Forget panels whose rows have gone, so a page left open for a week
        // does not hold the history of every session it has ever shown.
        const liveIds = new Set(rows.map((r) => r.id));
        const liveSessions = new Set(rows.map((r) => r.sessionId).filter(Boolean));
        for (const id of expanded) if (!liveIds.has(id)) expanded.delete(id);
        for (const id of recent.keys()) if (!liveSessions.has(id)) recent.delete(id);

        noticeEl.innerHTML = '';
        if (payload.warning) {
          const n = document.createElement('div');
          n.className = 'notice';
          n.textContent = payload.warning;
          noticeEl.appendChild(n);
        }

        const s = payload.summary || {};
        countsEl.innerHTML = '';
        const pills = [];
        if (s.blocked) pills.push([s.blocked + ' waiting for you', 'alert']);
        if (s.review) pills.push([s.review + ' awaiting review', 'review']);
        if (s.decision) pills.push([s.decision + ' awaiting a decision', 'decision']);
        if (s.parked) pills.push([s.parked + ' parked', '']);
        if (s.failed) pills.push([s.failed + ' failed', '']);
        for (const [text, tone] of pills) {
          const p = document.createElement('span');
          p.className = tone ? 'pill ' + tone : 'pill';
          p.textContent = text;
          countsEl.appendChild(p);
        }
        // How many rows a person is the blocker on, counted in `dashboard.js`
        // off the same set each row's own `wantsYou` comes from - so the number
        // in the tab and the rows behind it cannot disagree. It was two written
        // -out lists until this branch had to add `decision` to both by hand.
        document.title = s.wantsYou ? '(' + s.wantsYou + ') Raise' : 'Raise';
        showFavicon();

        rowsEl.innerHTML = '';
        if (rows.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML =
            '<h2>Nothing running</h2><div>Start a Claude session and it will appear here.</div>';
          rowsEl.appendChild(empty);
          return;
        }

        // Grouped by attention, except for the runs we could not attribute -
        // those go last, in a section of their own, whatever state they are in.
        //
        // `sortRows` already puts them at the end of the list, and that is not
        // enough on its own: the groups below are built by filtering the whole
        // list per attention, so a parked run landed in "Pipeline parked at a
        // gate" and sat above every working session. A card with no window
        // behind it must never outrank one you can act on - it cannot take you
        // anywhere, and this page ranks by who you can go and help.
        //
        // Sessions nothing has reported get the same treatment, one section
        // further down: `untracked` is not in GROUPS at all, because it is not
        // an attention level - it is the absence of one - and a card that
        // cannot say what it is doing must not sit among the ones that can.
        const untracked = rows.filter((r) => r.kind === 'untracked');
        const placed = rows.filter((r) => r.kind !== 'untracked' && r.attributable !== false);
        const unattributed = rows.filter((r) => r.kind !== 'untracked' && r.attributable === false);

        for (const [key, label] of GROUPS) {
          const group = placed.filter((r) => r.attention === key);
          if (group.length === 0) continue;
          const title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = label;
          rowsEl.appendChild(title);
          for (const row of group) rowsEl.appendChild(card(row));
        }

        if (unattributed.length > 0) {
          const title = document.createElement('div');
          title.className = 'group-title';
          // Named for the one thing every card under it has in common, rather
          // than for the pipeline that was the only one when it was written: a
          // set of rulings with no crewmate row to sit on lands here too, and a
          // heading calling it a pipeline would be wrong about it.
          title.textContent = 'We could not place these';
          rowsEl.appendChild(title);
          for (const row of unattributed) rowsEl.appendChild(card(row));
        }

        if (untracked.length > 0) {
          const title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = 'Not reporting to Raise';
          rowsEl.appendChild(title);
          for (const row of untracked) rowsEl.appendChild(card(row));
        }

        notifyOnNewlyBlocked(rows);
      }

      /*
       * Each of these means the agent has stopped and only a person can restart
       * it, so each is worth a notification. They differ in where they send
       * you: a blocked session wants its terminal, a review wants the browser
       * page it is waiting on, and a firstmate crewmate wants a ruling - which
       * is given in the captain's window, but the crewmate's is where you go to
       * read what it is asking, so it is focused like any other stopped session.
       */
      function notifyOnNewlyBlocked(rows) {
        const waiting = new Set(rows.filter((r) => r.wantsYou).map((r) => r.id));
        if (hasNotifications() && Notification.permission === 'granted') {
          for (const row of rows) {
            if (!row.wantsYou || lastBlocked.has(row.id)) continue;
            const review = row.attention === 'review';
            const decision = row.attention === 'decision';
            const firstDecision = (row.decisions || [])[0];
            // A notification is a pointer rather than the list, so it carries
            // one summary - but it may not imply there is one when there are
            // four. The count goes in front of it, in the words the card and
            // `raise status` already use, and carries nothing for a single
            // ruling because "wants a decision" has said that already.
            const rulings = row.decisionsLabel;
            const n = new Notification(
              // In the title rather than the body, because the body already
              // carries the reason and two identically titled notifications for
              // one repo are indistinguishable before you read either.
              row.title +
                (row.sessionName ? ' - ' + row.sessionName : '') +
                (review ? ' wants your review' : decision ? ' wants a decision' : ' needs you'),
              {
                body: review
                  ? row.summary || 'A review page is waiting for you'
                  : decision
                    ? [
                        rulings,
                        (firstDecision && firstDecision.summary) ||
                          'A firstmate crewmate is waiting on a ruling',
                      ]
                        .filter(Boolean)
                        .join(' - ')
                    : row.message || 'Claude is waiting for input',
                tag: row.id,
              },
            );
            n.onclick = () => {
              window.focus();
              if (review && row.reviewUrl) window.open(row.reviewUrl, '_blank', 'noreferrer');
              else focusRow(row);
            };
          }
        }
        lastBlocked = waiting;
      }

      function hasNotifications() {
        return typeof Notification !== 'undefined';
      }

      notifyBtn.addEventListener('click', async () => {
        if (!hasNotifications()) return;
        updateNotifyButton(await Notification.requestPermission());
      });

      function updateNotifyButton(permission) {
        if (!hasNotifications()) {
          notifyBtn.textContent = 'Alerts unavailable';
          notifyBtn.disabled = true;
          return;
        }
        if (permission === 'granted') {
          notifyBtn.textContent = 'Alerts on';
          notifyBtn.disabled = true;
        } else if (permission === 'denied') {
          notifyBtn.textContent = 'Alerts blocked';
          notifyBtn.disabled = true;
        }
      }
      updateNotifyButton(hasNotifications() ? Notification.permission : 'denied');

      const watch = createConnectionWatch();
      // Seeded with what this tab loaded, which is the only thing it can know
      // first-hand about its own code.
      const buildWatch = createBuildWatch(BUILD);
      let source = null;

      /**
       * Offer the reload; never take it.
       *
       * An auto-reloading dashboard would discard whatever the user has
       * expanded, at an arbitrary moment, on a page they are watching precisely
       * because something needs them - so this only ever shows a button. The
       * button is the whole of the behaviour.
       */
      function showBuildNotice() {
        buildBtn.hidden = !buildWatch.isStale();
      }

      buildBtn.title =
        'This tab is running the page it loaded with. Raise is serving a newer one - ' +
        'reload to pick it up.';
      buildBtn.addEventListener('click', () => location.reload());

      function showConnection() {
        const { text, tone } = connectionLabel(watch.status(), watch.quietForMs());
        connectionTone = tone;
        connTextEl.textContent = text;
        dotEl.className = 'dot' + (tone === 'bad' ? ' off' : tone === 'wait' ? ' wait' : '');
        connEl.className = 'conn' + (tone === 'bad' ? ' off' : '');
        // Dim what we can no longer vouch for. A blocked session that cleared
        // ten minutes ago must not keep sitting there looking current.
        document.body.classList.toggle('unconfirmed', tone === 'bad');
        showFavicon();
      }

      function connect() {
        const reopening = source !== null;
        if (source) source.close();
        if (reopening) watch.noteReconnect();
        showConnection();
        source = new EventSource('/events?t=' + TOKEN);
        source.addEventListener('state', (event) => {
          watch.noteMessage();
          showConnection();
          const payload = JSON.parse(event.data);
          // Before the render rather than after it, so a frame this page is too
          // old to render correctly is still the frame that says so. A server
          // that predates the field sends nothing here, and the watch treats
          // that as no answer rather than as disagreement.
          buildWatch.noteServed(payload.build);
          showBuildNotice();
          render(payload);
        });
        // Nothing to render; its whole purpose is being evidence that the
        // server is still on the other end.
        source.addEventListener('ping', () => {
          watch.noteMessage();
          showConnection();
        });
        source.onerror = () => {
          watch.noteError();
          showConnection();
        };
      }
      connect();

      // Keep the elapsed times honest between pushes, and re-judge the
      // connection: going stale is the passage of time, so nothing else will
      // ever wake us up to notice it.
      setInterval(() => {
        showConnection();
        // A half-open socket never recovers on its own, and EventSource will
        // not retry one it still believes is open. Tear it down and let the
        // reconnect prove the server either is or is not there.
        if (watch.shouldReconnect()) connect();
        if (latest) render(latest);
      }, 5000);

      // An open panel keeps itself current. Only open ones cost anything: with
      // nothing expanded this fires, finds no sessions and does no work.
      setInterval(async () => {
        const ids = expandedSessionIds();
        if (ids.length === 0) return;
        await Promise.all(ids.map(fetchRecent));
        if (latest) render(latest);
      }, EXPANDO_REFRESH_MS);

      // Waking from sleep is the common case, and it should not take five
      // seconds of staring at a stale page to find out.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        showConnection();
        if (watch.shouldReconnect()) connect();
      });
    </script>
  </body>
</html>
