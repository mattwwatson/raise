# Why this exists: until now nothing checked a pull request. The no-mistakes CI
# step would sit on a PR waiting for checks that never registered, so a branch
# that had gone stale against main - or broken outright - was noticed by nothing
# but a human reading the diff.
#
# It runs exactly what AGENTS.md calls mandatory, `npm test` and
# `npm run typecheck`, and nothing else. There is deliberately no linter: this
# repo has two devDependencies on purpose, and adding a third is a decision to
# raise rather than smuggle in through CI. Coverage is left out for a different
# reason - nothing enforces a threshold, so it would produce a number nobody
# reads and a minute nobody gets back.
#
# Node 24 only, and the version is the interesting decision. `engines` claims a
# floor of 22.5, but three test files import `node:sqlite`, which needs
# `--experimental-sqlite` until Node 23.4 - so a Node 22 job would most likely
# go red on arrival, and the honest reading is that the floor claim is untested
# rather than that CI is missing a job. 24 is what the docs tell a contributor
# to install for coverage, so it is the version they are most likely on.
# Testing the floor is worth doing once the claim itself has been settled.

image: node:24

definitions:
  steps:
    - step: &test-and-typecheck
        name: Tests and typecheck
        caches:
          - node
        script:
          - npm ci
          - npm test
          - npm run typecheck

pipelines:
  # Every pull request, which is what the no-mistakes CI step watches. Defining
  # this means `default` does not also fire for a branch with an open PR, so a
  # push does not pay for two identical runs.
  pull-requests:
    '**':
      - step: *test-and-typecheck

  # And main itself, so a merge that breaks the build says so rather than
  # waiting for the next pull request to discover it.
  branches:
    main:
      - step: *test-and-typecheck
